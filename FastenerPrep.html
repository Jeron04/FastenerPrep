<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FastenerPrep</title>
<style>
:root{
  color-scheme:dark;
  --bg:#0b0e11;
  --panel:#14181c;
  --panel2:#101419;
  --line:#30383e;
  --line2:#454e55;
  --text:#f0f3f4;
  --muted:#8d979e;
  --accent:#a93a40;
  --accent2:#cf5158;
  --redModel:#7f2027;
  --redModelHi:#ad3a42;
  --redModelEdge:#d87378;
}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--text)}
body{font-family:Bahnschrift,"DIN Alternate","Arial Narrow","Segoe UI",Arial,sans-serif}

.app{
  width:100%;
  height:100dvh;
  display:grid;
  grid-template-rows:auto auto auto minmax(0,1fr);
  gap:6px;
  padding:7px 10px;
  overflow:hidden;
}

.topbar{
  display:flex;
  align-items:flex-end;
  justify-content:space-between;
  gap:14px;
  min-height:34px;
  padding:0 2px 6px;
  border-bottom:1px solid var(--line);
  position:relative;
}
.topbar:after{
  content:"";
  position:absolute;
  left:2px;bottom:-1px;
  width:132px;height:1px;
  background:var(--accent2);
}
.logo{
  display:flex;
  align-items:baseline;
  line-height:.85;
  color:#fafcfc;
  text-shadow:1px 1px 0 #5a6065,2px 2px 0 #3b4146,3px 3px 0 #23282c,4px 4px 0 #101316;
}
.logoBig{font-size:25px;font-weight:900;letter-spacing:.01em}
.logoSmall{font-size:15px;font-weight:900;letter-spacing:.06em}
.tagline{font-size:8px;letter-spacing:.12em;color:#7d878d;text-transform:uppercase;padding-bottom:1px}

.controlbar{
  display:grid;
  grid-template-columns:210px minmax(270px,1fr) auto;
  gap:7px;
  align-items:stretch;
  padding:5px 7px;
  border:1px solid var(--line);
  border-radius:7px;
  background:var(--panel2);
}
.controlgroup{
  min-width:0;
  display:flex;
  align-items:center;
  gap:6px;
}
.controlLabel{
  flex:0 0 auto;
  font-size:8px;
  font-weight:900;
  letter-spacing:.14em;
  text-transform:uppercase;
  color:#a4adb2;
}
.segment{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:5px;
  flex:1 1 auto;
  min-width:0;
}
button,select,input{
  font:inherit;
}
button{
  border:1px solid var(--line2);
  background:#1a1f23;
  color:#c8cfd3;
  border-radius:5px;
  min-height:29px;
  padding:4px 9px;
  font-size:10px;
  font-weight:850;
  cursor:pointer;
}
button:hover:not(:disabled){background:#242a2f;color:white}
button:disabled{opacity:.36;cursor:not-allowed}
.segment button{
  width:100%;
  min-width:0;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:clip;
  display:flex;
  align-items:center;
  justify-content:center;
}
.segment button.active{
  color:#fff;
  background:#3a2023;
  border-color:#b94b51;
  box-shadow:inset 0 -2px 0 var(--accent2);
}
.sizeGroup{
  display:grid;
  grid-template-columns:auto minmax(0,1fr);
  align-items:center;
  gap:8px;
  min-width:0;
}
select{
  width:100%;
  min-width:0;
  height:30px;
  border:1px solid var(--line2);
  border-radius:5px;
  background:#0e1215;
  color:#f2f4f5;
  padding:3px 30px 3px 10px;
  font-size:11px;
  font-weight:850;
}
.saveBtn{
  min-width:116px;
  background:#8f3036;
  border-color:#bd4a50;
  color:#fff;
  letter-spacing:.05em;
}
.saveBtn:hover:not(:disabled){background:#a83a40}

.qtybar{
  display:grid;
  grid-template-columns:auto repeat(3,minmax(132px,1fr));
  gap:7px;
  align-items:center;
  padding:4px 7px;
  border:1px solid var(--line);
  border-radius:7px;
  background:#101419;
}
.qtyTitle{
  font-size:8px;
  letter-spacing:.15em;
  font-weight:900;
  color:#a7b0b5;
}
.qtyItem{
  min-width:0;
  display:grid;
  grid-template-columns:auto 1fr;
  gap:7px;
  align-items:center;
  padding:3px 5px;
  border:1px solid #343c42;
  border-radius:5px;
  background:#171b1f;
}
.qtyName{
  font-size:8px;
  font-weight:900;
  letter-spacing:.1em;
  color:#bec5c9;
}
.stepper{
  display:grid;
  grid-template-columns:28px minmax(36px,1fr) 28px;
  border:1px solid #3d464c;
  border-radius:5px;
  overflow:hidden;
  background:#0d1114;
}
.stepper button{
  min-height:25px;
  border:0;
  border-radius:0;
  padding:0;
  background:#20252a;
  font-size:14px;
  color:#d7dcdf;
}
.stepper input{
  width:100%;
  min-width:0;
  border:0;
  border-left:1px solid #343c42;
  border-right:1px solid #343c42;
  background:#0d1114;
  color:#fff;
  text-align:center;
  font-size:10px;
  font-weight:900;
  outline:none;
  appearance:textfield;
}
.stepper input::-webkit-inner-spin-button,.stepper input::-webkit-outer-spin-button{appearance:none;margin:0}

.workspace{
  min-height:0;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:8px;
}
.editor{
  min-width:0;
  min-height:0;
  display:grid;
  grid-template-rows:auto minmax(0,1fr);
  border:1px solid var(--line);
  border-radius:8px;
  overflow:hidden;
  background:var(--panel);
}
.editorHead{
  min-height:34px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:5px 8px;
  border-bottom:1px solid var(--line);
  background:#171c20;
}
.editorTitle strong{
  display:block;
  font-size:12px;
  letter-spacing:.14em;
}
.editorTitle span{
  display:block;
  margin-top:1px;
  font-size:7px;
  letter-spacing:.11em;
  color:#879198;
}
.resetBtn{
  min-height:23px;
  padding:2px 8px;
  font-size:8px;
  color:#a8b1b6;
}
.stage{
  position:relative;
  min-height:0;
  overflow:hidden;
  background:
    linear-gradient(rgba(180,190,198,.026) 1px,transparent 1px),
    linear-gradient(90deg,rgba(180,190,198,.026) 1px,transparent 1px),
    radial-gradient(circle at 50% 46%,rgba(90,103,112,.09),transparent 48%),
    linear-gradient(180deg,#151a1e,#0d1013);
  background-size:38px 38px,38px 38px,auto,auto;
}
.stage canvas{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  touch-action:none;
  cursor:grab;
}
.stage canvas.dragging{cursor:grabbing}

/* Fixed drafting dimensions: these never inherit model transform */
.dim{
  position:absolute;
  z-index:5;
  pointer-events:none;
}
.dimLine,.dimCap{
  position:absolute;
  background:#f2f5f6;
  opacity:.84;
}
.dimV .dimLine{width:2px;left:17px;top:0;height:100%}
.dimV .dimCap{height:2px;width:18px;left:8px}
.dimV .dimCap.top{top:0}
.dimV .dimCap.bottom{bottom:0}
.dimControl{
  position:absolute;
  pointer-events:auto;
}
.dimLabel{
  display:block;
  margin-bottom:4px;
  font-size:8px;
  font-weight:900;
  letter-spacing:.06em;
  text-transform:uppercase;
  color:#cbd1d4;
}
.dimInput{
  display:flex;
  align-items:center;
  gap:4px;
  width:max-content;
  padding:3px 5px;
  border:1px solid #879198;
  border-radius:5px;
  background:#101316;
  box-shadow:0 0 0 3px #101316;
}
.dimInput:focus-within{
  border-color:#c14b52;
  box-shadow:0 0 0 3px #101316,0 0 0 4px rgba(193,75,82,.16);
}
.dimInput input{
  width:62px;
  min-height:23px;
  padding:2px 4px;
  border:1px solid #4a5359;
  border-radius:4px;
  background:#0b0f12;
  color:#fff;
  text-align:center;
  font-family:Consolas,"SFMono-Regular",monospace;
  font-size:10px;
  font-weight:800;
}
.dimInput span{font-size:8px;font-weight:850;color:#aeb7bc}

.shaftLengthDim{
  right:8px;
  top:9%;
  width:140px;
  height:67%;
}
.shaftLengthDim .dimControl{left:43px;top:50%;transform:translateY(-50%)}

.headHeightDim{
  left:10px;
  bottom:7%;
  width:140px;
  height:20%;
}
.headHeightDim .dimControl{left:43px;top:50%;transform:translateY(-50%)}

.nutThicknessDim{
  right:8px;
  top:27%;
  width:140px;
  height:40%;
}
.nutThicknessDim .dimControl{left:43px;top:50%;transform:translateY(-50%)}

.editor.locked .dimControl{opacity:.36}
.editor.locked .dimLine,.editor.locked .dimCap{opacity:.24}
.editor.locked canvas{filter:saturate(.55) brightness(.88)}

.moveHint{
  position:absolute;
  left:8px;
  top:8px;
  z-index:4;
  pointer-events:none;
  font-size:7px;
  font-weight:800;
  letter-spacing:.1em;
  color:#6f7b82;
  text-transform:uppercase;
}

.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:grid;
  place-items:center;
  padding:14px;
  background:rgba(5,7,9,.84);
}
.modal.hidden{display:none}
.modalCard{
  width:min(900px,calc(100vw - 28px));
  max-height:calc(100dvh - 28px);
  display:grid;
  grid-template-rows:auto auto minmax(0,1fr) auto;
  gap:8px;
  padding:12px;
  border:1px solid #3b444a;
  border-radius:8px;
  background:#14181c;
  box-shadow:0 24px 80px rgba(0,0,0,.55);
}
.modalTop{
  display:flex;
  justify-content:space-between;
  align-items:flex-end;
  gap:10px;
}
.modalTop small{
  display:block;
  font-size:8px;
  letter-spacing:.14em;
  color:#8e989e;
}
.modalTop h2{
  margin:2px 0 0;
  font-size:18px;
}
.modalSummary{font-size:9px;color:#9ba5ab}
.modalHelp{margin:0;color:#8e989e;font-size:9px}
.previewWrap{
  min-height:260px;
  border:1px solid #30383e;
  border-radius:6px;
  overflow:hidden;
  background:#0d1114;
}
.previewWrap canvas{width:100%;height:100%;display:block}
.modalActions{
  display:flex;
  justify-content:flex-end;
  gap:7px;
  padding-top:8px;
  border-top:1px solid #343c42;
}
.modalActions .primary{
  min-width:120px;
  background:#8f3036;
  border-color:#bd4a50;
  color:white;
}
.message{
  position:fixed;
  left:50%;
  bottom:12px;
  z-index:120;
  transform:translateX(-50%);
  padding:7px 10px;
  border:1px solid #4a535a;
  border-radius:6px;
  background:#171c20;

<script>
(() => {
"use strict";

const INCH=25.4;
const BOLT_ALLOWANCE=0.00; // Bolt blank OD is nominal major diameter for die cutting.
// External-thread blank rule: use nominal major diameter; the die cuts the thread roots.
const NUT_HOLE_ALLOWANCE=0.20;
const WASHER_HOLE_CLEARANCE=0.50;

const METRIC={
  M2:{d:2,boltL:16,boltAF:4,boltH:1.4,nutAF:4,nutH:1.6,wOD:5,wH:.3},
  "M2.5":{d:2.5,boltL:20,boltAF:5,boltH:1.7,nutAF:5,nutH:2,wOD:6,wH:.5},
  M3:{d:3,boltL:20,boltAF:5.5,boltH:2,nutAF:5.5,nutH:2.4,wOD:7,wH:.5},
  M4:{d:4,boltL:25,boltAF:7,boltH:2.8,nutAF:7,nutH:3.2,wOD:9,wH:.8},
  M5:{d:5,boltL:30,boltAF:8,boltH:3.5,nutAF:8,nutH:4,wOD:10,wH:1},
  M6:{d:6,boltL:35,boltAF:10,boltH:4,nutAF:10,nutH:5,wOD:12,wH:1.6},
  M8:{d:8,boltL:40,boltAF:13,boltH:5.3,nutAF:13,nutH:6.5,wOD:16,wH:1.6},
  M10:{d:10,boltL:50,boltAF:17,boltH:6.4,nutAF:17,nutH:8,wOD:20,wH:2},
  M12:{d:12,boltL:60,boltAF:19,boltH:7.5,nutAF:19,nutH:10,wOD:24,wH:2.5},
  M14:{d:14,boltL:70,boltAF:22,boltH:8.8,nutAF:22,nutH:11,wOD:28,wH:2.5},
  M16:{d:16,boltL:80,boltAF:24,boltH:10,nutAF:24,nutH:13,wOD:30,wH:3},
  M18:{d:18,boltL:90,boltAF:27,boltH:11.5,nutAF:27,nutH:15,wOD:34,wH:3},
  M20:{d:20,boltL:100,boltAF:30,boltH:12.5,nutAF:30,nutH:16,wOD:37,wH:3},
  M22:{d:22,boltL:110,boltAF:32,boltH:14,nutAF:32,nutH:18,wOD:39,wH:3},
  M24:{d:24,boltL:120,boltAF:36,boltH:15,nutAF:36,nutH:19,wOD:44,wH:4},
  M27:{d:27,boltL:130,boltAF:41,boltH:17,nutAF:41,nutH:22,wOD:50,wH:4},
  M30:{d:30,boltL:140,boltAF:46,boltH:18.7,nutAF:46,nutH:24,wOD:56,wH:4}
};
const METRIC_ORDER=["M2","M2.5","M3","M4","M5","M6","M8","M10","M12","M14","M16","M18","M20","M22","M24","M27","M30"];
const SAE={
  "#2":{d:.086,boltL:.5,boltAF:.125,boltH:.050,nutAF:.188,nutH:.066,wOD:.250,wH:.020},
  "#4":{d:.112,boltL:.5,boltAF:.188,boltH:.060,nutAF:.250,nutH:.098,wOD:.312,wH:.032},
  "#6":{d:.138,boltL:.625,boltAF:.250,boltH:.093,nutAF:.312,nutH:.114,wOD:.375,wH:.049},
  "#8":{d:.164,boltL:.75,boltAF:.250,boltH:.110,nutAF:.344,nutH:.130,wOD:.438,wH:.049},
  "#10":{d:.190,boltL:1,boltAF:.312,boltH:.120,nutAF:.375,nutH:.130,wOD:.500,wH:.049},
  "#12":{d:.216,boltL:1,boltAF:.312,boltH:.155,nutAF:.438,nutH:.161,wOD:.562,wH:.065},
  "1/4":{d:.250,boltL:1,boltAF:.4375,boltH:.171875,nutAF:.438,nutH:.226,wOD:.625,wH:.065},
  "5/16":{d:.3125,boltL:1.25,boltAF:.500,boltH:.21875,nutAF:.500,nutH:.273,wOD:.688,wH:.065},
  "3/8":{d:.375,boltL:1.5,boltAF:.5625,boltH:.250,nutAF:.563,nutH:.337,wOD:.812,wH:.065},
  "7/16":{d:.4375,boltL:1.75,boltAF:.625,boltH:.296875,nutAF:.688,nutH:.385,wOD:.922,wH:.065},
  "1/2":{d:.500,boltL:2,boltAF:.750,boltH:.34375,nutAF:.750,nutH:.448,wOD:1.062,wH:.095},
  "5/8":{d:.625,boltL:2.5,boltAF:.9375,boltH:.421875,nutAF:.938,nutH:.559,wOD:1.312,wH:.095},
  "3/4":{d:.750,boltL:3,boltAF:1.125,boltH:.500,nutAF:1.125,nutH:.665,wOD:1.469,wH:.134},
  "7/8":{d:.875,boltL:3.5,boltAF:1.3125,boltH:.578125,nutAF:1.312,nutH:.776,wOD:1.750,wH:.134},
  "1":{d:1,boltL:4,boltAF:1.500,boltH:.671875,nutAF:1.500,nutH:.887,wOD:2.000,wH:.134},
  "1-1/8":{d:1.125,boltL:4.5,boltAF:1.6875,boltH:.750,nutAF:1.688,nutH:.999,wOD:2.250,wH:.134},
  "1-1/4":{d:1.250,boltL:5,boltAF:1.875,boltH:.84375,nutAF:1.875,nutH:1.094,wOD:2.500,wH:.165},
  "1-3/8":{d:1.375,boltL:5.5,boltAF:2.0625,boltH:.90625,nutAF:2.062,nutH:1.206,wOD:2.750,wH:.165},
  "1-1/2":{d:1.500,boltL:6,boltAF:2.250,boltH:1.000,nutAF:2.250,nutH:1.317,wOD:3.000,wH:.165}
};
const SAE_ORDER=["#2","#4","#6","#8","#10","#12","1/4","5/16","3/8","7/16","1/2","5/8","3/4","7/8","1","1-1/8","1-1/4","1-3/8","1-1/2"];

const $=id=>document.getElementById(id);
const el={
  metric:$("metricBtn"),sae:$("saeBtn"),size:$("sizeSel"),save:$("saveBtn"),
  boltQty:$("boltQty"),nutQty:$("nutQty"),washerQty:$("washerQty"),
  boltEditor:$("boltEditor"),nutEditor:$("nutEditor"),
  boltReset:$("boltReset"),nutReset:$("nutReset"),
  shaft:$("shaftLength"),head:$("headHeight"),nutT:$("nutThickness"),
  shaftUnit:$("shaftUnit"),headUnit:$("headUnit"),nutUnit:$("nutUnit"),
  boltCanvas:$("boltCanvas"),nutCanvas:$("nutCanvas"),
  modal:$("modal"),preview:$("previewCanvas"),modalSummary:$("modalSummary"),
  back:$("backBtn"),download:$("downloadBtn"),message:$("message")
};

let system="";
let activeKey="";
let exportObjects=[];
let exportMesh=[];
let exportMeta=null;
let toastTimer=null;

const DEFAULT_VIEW={yaw:-0.18,pitch:0.78,zoom:1};
const START_VIEW={
  // Reference composition, visibly flipped 180 degrees around camera X.
  bolt:{yaw:-0.03,pitch:4.2615926536,zoom:1.04},
  nut:{yaw:-0.18,pitch:3.9215926536,zoom:0.86}
};

const view={
  bolt:{...START_VIEW.bolt,drag:false,px:0,py:0},
  nut:{...START_VIEW.nut,drag:false,px:0,py:0}
};

function clamp(n,a,b){return Math.max(a,Math.min(b,n))}
function qty(input){
  const v=Math.floor(Number(input.value));
  return Number.isFinite(v)?clamp(v,0,20):0;
}
function unit(){return system==="SAE"?"in":"mm"}
function toMM(v){return system==="SAE"?v*INCH:v}
function fromMM(v){return system==="SAE"?v/INCH:v}
function fmt(v){return Number(v.toFixed(system==="SAE"?4:2)).toString()}
function currentTable(){return system==="SAE"?SAE:METRIC}
function currentData(){return system&&activeKey?currentTable()[activeKey]:null}
function show(msg){
  clearTimeout(toastTimer);
  el.message.textContent=msg;
  el.message.classList.add("show");
  toastTimer=setTimeout(()=>el.message.classList.remove("show"),2600);
}

function setSystem(next){
  system=next;
  activeKey="";
  el.metric.classList.toggle("active",system==="METRIC");
  el.sae.classList.toggle("active",system==="SAE");
  fillSizes();
  syncLock();
  syncInputs();
  renderAll();
}
function fillSizes(){
  const keys=system==="SAE"?SAE_ORDER:METRIC_ORDER;
  el.size.innerHTML='<option value="">Select size...</option>'+keys.map(k=>`<option value="${k}">${k}</option>`).join("");
  el.size.value="";
}
function selectSize(k){
  activeKey=k;
  syncLock();
  syncInputs();
  resetViews();
  renderAll();
}
function syncLock(){
  const locked=!currentData();
  [el.shaft,el.head,el.nutT,el.boltReset,el.nutReset].forEach(x=>x.disabled=locked);
  el.boltEditor.classList.toggle("locked",locked);
  el.nutEditor.classList.toggle("locked",locked);
  el.shaftUnit.textContent=unit();
  el.headUnit.textContent=unit();
  el.nutUnit.textContent=unit();
}
function syncInputs(){
  const d=currentData();
  if(!d){
    const fallback=METRIC.M10;
    el.shaft.value="30";
    el.head.value=fmt(fallback.boltH);
    el.nutT.value=fmt(fallback.nutH);
    el.shaftUnit.textContent="mm";el.headUnit.textContent="mm";el.nutUnit.textContent="mm";
    return;
  }
  el.shaft.value=fmt(d.boltL);
  el.head.value=fmt(d.boltH);
  el.nutT.value=fmt(d.nutH);
}
function resetViews(){
  Object.assign(view.bolt,START_VIEW.bolt);
  Object.assign(view.nut,START_VIEW.nut);
}

function tri(a,b,c){return [a,b,c]}
function normal(a,b,c){
  const ux=b.x-a.x,uy=b.y-a.y,uz=b.z-a.z;
  const vx=c.x-a.x,vy=c.y-a.y,vz=c.z-a.z;
  return {x:uy*vz-uz*vy,y:uz*vx-ux*vz,z:ux*vy-uy*vx};
}
function ring(r,z,segments=48){
  return Array.from({length:segments},(_,i)=>{
    const a=i*2*Math.PI/segments;
    return {x:r*Math.cos(a),y:r*Math.sin(a),z};
  });
}
function hexRing(af,z,segments=48){
  const verts=Array.from({length:6},(_,i)=>{
    const a=Math.PI/6+i*Math.PI/3;
    const r=af/(2*Math.cos(Math.PI/6));
    return {x:r*Math.cos(a),y:r*Math.sin(a)};
  });
  function rayPoint(angle){
    const ca=Math.cos(angle),sa=Math.sin(angle);
    let best=Infinity;
    for(let i=0;i<6;i++){
      const a=verts[i],b=verts[(i+1)%6];
      const ex=b.x-a.x,ey=b.y-a.y;
      const den=ca*ey-sa*ex;
      if(Math.abs(den)<1e-12) continue;
      const t=(a.x*ey-a.y*ex)/den;
      const u=(a.x*sa-a.y*ca)/den;
      if(t>0 && u>=-1e-9 && u<=1+1e-9) best=Math.min(best,t);
    }
    return {x:best*ca,y:best*sa,z};
  }
  return Array.from({length:segments},(_,i)=>rayPoint(i*2*Math.PI/segments));
}
function addOuterWall(tris,lo,hi){
  const n=lo.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    tris.push(tri(lo[i],lo[j],hi[j]),tri(lo[i],hi[j],hi[i]));
  }
}
function addInnerWall(tris,lo,hi){
  const n=lo.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    tris.push(tri(lo[i],hi[j],lo[j]),tri(lo[i],hi[i],hi[j]));
  }
}
function addTopAnnulus(tris,outer,inner){
  const n=outer.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    tris.push(tri(outer[i],outer[j],inner[j]),tri(outer[i],inner[j],inner[i]));
  }
}
function addBottomAnnulus(tris,outer,inner){
  const n=outer.length;
  for(let i=0;i<n;i++){
    const j=(i+1)%n;
    tris.push(tri(outer[i],inner[j],outer[j]),tri(outer[i],inner[i],inner[j]));
  }
}
function addTopCap(tris,loop,z){
  const c={x:0,y:0,z};
  for(let i=0;i<loop.length;i++){
    const j=(i+1)%loop.length;
    tris.push(tri(c,loop[i],loop[j]));
  }
}
function addBottomCap(tris,loop,z){
  const c={x:0,y:0,z};
  for(let i=0;i<loop.length;i++){
    const j=(i+1)%loop.length;
    tris.push(tri(c,loop[j],loop[i]));
  }
}
function signedVolume(tris){
  let v=0;
  for(const [a,b,c] of tris){
    v+=(a.x*(b.y*c.z-b.z*c.y)+a.y*(b.z*c.x-b.x*c.z)+a.z*(b.x*c.y-b.y*c.x))/6;
  }
  return v;
}
function ensureOutward(tris){
  if(signedVolume(tris)<0){
    for(let i=0;i<tris.length;i++) tris[i]=[tris[i][0],tris[i][2],tris[i][1]];
  }
  return tris;
}
function makeBolt(d,sys,shaftLenUser,headHUser){
  const conv=sys==="SAE"?INCH:1;
  const shaftD=Math.max(.1,d.d*conv);
  const L=Math.max(.1,shaftLenUser*conv);
  const H=Math.max(.1,headHUser*conv);
  const AF=d.boltAF*conv;
  const seg=48;
  const tris=[];

  const head0=hexRing(AF,0,seg);
  const head1=hexRing(AF,H,seg);
  const shaftR=shaftD/2;
  const cham=Math.min(shaftD*.12,1.1,L*.35);
  const zChamStart=H+Math.max(.05,L-cham);
  const shaft0=ring(shaftR,H,seg);
  const shaft1=ring(shaftR,zChamStart,seg);
  const tipR=Math.max(.05,shaftR-cham*.45);
  const tip=ring(tipR,H+L,seg);

  addBottomCap(tris,head0,0);
  addOuterWall(tris,head0,head1);
  addTopAnnulus(tris,head1,shaft0);
  addOuterWall(tris,shaft0,shaft1);
  addOuterWall(tris,shaft1,tip);
  addTopCap(tris,tip,H+L);

  ensureOutward(tris);
  return {tris,dims:{shaftD,L,H,AF,cham,overall:H+L}};
}
function makeNut(d,sys,thicknessUser){
  const conv=sys==="SAE"?INCH:1;
  const H=Math.max(.1,thicknessUser*conv);
  const AF=d.nutAF*conv;
  const holeD=Math.max(.1,d.d*conv-NUT_HOLE_ALLOWANCE);
  const innerR=holeD/2;
  const cham=Math.min(H*.16,innerR*.18,.8,H*.24);
  const openR=innerR+cham;
  const seg=48;
  const tris=[];

  const outer0=hexRing(AF,0,seg);
  const outer1=hexRing(AF,H,seg);
  const open0=ring(openR,0,seg);
  const inner0=ring(innerR,cham,seg);
  const inner1=ring(innerR,H-cham,seg);
  const open1=ring(openR,H,seg);

  addOuterWall(tris,outer0,outer1);
  addBottomAnnulus(tris,outer0,open0);
  addInnerWall(tris,open0,inner0);
  addInnerWall(tris,inner0,inner1);
  addInnerWall(tris,inner1,open1);
  addTopAnnulus(tris,outer1,open1);

  ensureOutward(tris);
  return {tris,dims:{H,AF,holeD,cham,openingD:openR*2}};
}
function makeWasher(d,sys){
  const conv=sys==="SAE"?INCH:1;
  const H=d.wH*conv;
  const OD=d.wOD*conv;
  const holeD=d.d*conv+WASHER_HOLE_CLEARANCE;
  const ro=OD/2,ri=holeD/2,seg=64,tris=[];
  const outer0=ring(ro,0,seg),outer1=ring(ro,H,seg);
  const inner0=ring(ri,0,seg),inner1=ring(ri,H,seg);

  addOuterWall(tris,outer0,outer1);
  addInnerWall(tris,inner0,inner1);
  addBottomAnnulus(tris,outer0,inner0);
  addTopAnnulus(tris,outer1,inner1);

  ensureOutward(tris);
  return {tris,dims:{H,OD,holeD}};
}

function editorGeometry(){
  const d=currentData();
  if(d){
    return {
      bolt:makeBolt(d,system,Number(el.shaft.value)||d.boltL,Number(el.head.value)||d.boltH),
      nut:makeNut(d,system,Number(el.nutT.value)||d.nutH)
    };
  }
  const f=METRIC.M10;
  return {bolt:makeBolt(f,"METRIC",30,f.boltH),nut:makeNut(f,"METRIC",f.nutH)};
}

function bounds(tris){
  let minX=Infinity,minY=Infinity,minZ=Infinity,maxX=-Infinity,maxY=-Infinity,maxZ=-Infinity;
  for(const t of tris) for(const p of t){
    minX=Math.min(minX,p.x);minY=Math.min(minY,p.y);minZ=Math.min(minZ,p.z);
    maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);maxZ=Math.max(maxZ,p.z);
  }
  return {minX,minY,minZ,maxX,maxY,maxZ,w:maxX-minX,h:maxY-minY,d:maxZ-minZ};
}
function projectPoint(p,v){
  const cy=Math.cos(v.yaw),sy=Math.sin(v.yaw);
  const cp=Math.cos(v.pitch),sp=Math.sin(v.pitch);
  const x1=p.x*cy-p.y*sy;
  const y1=p.x*sy+p.y*cy;
  return {x:x1,y:y1*cp-p.z*sp,z:y1*sp+p.z*cp};
}
function renderModel(canvas,obj,v){
  const rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,rect.width*dpr),h=Math.max(1,rect.height*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,w,h);
  if(!obj||!obj.tris.length)return;

  const transformed=obj.tris.map(t=>t.map(p=>projectPoint(p,v)));
  const flat=transformed.flat();
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of flat){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}
  const bw=Math.max(1,maxX-minX),bh=Math.max(1,maxY-minY);
  const base=Math.min(w/(bw*1.65),h/(bh*1.38));
  const scale=base*v.zoom;
  const compose=canvas===el.boltCanvas
    ? {cx:.49,cy:.57}
    : {cx:.50,cy:.51};
  const cx=w*compose.cx,cy=h*compose.cy;
  const ox=(minX+maxX)/2,oy=(minY+maxY)/2;
  const faces=[];
  for(const t of transformed){
    const pts=t.map(p=>({x:cx+(p.x-ox)*scale,y:cy-(p.y-oy)*scale,z:p.z}));
    const n=normal(t[0],t[1],t[2]);
    const z=(t[0].z+t[1].z+t[2].z)/3;
    faces.push({pts,n,z});
  }
  faces.sort((a,b)=>a.z-b.z);
  for(const f of faces){
    const light=Math.max(.08,.33+.67*Math.abs(f.n.z*.7+f.n.x*.2+f.n.y*.1));
    const alpha=Math.min(.82,.34+light*.42);
    ctx.beginPath();
    ctx.moveTo(f.pts[0].x,f.pts[0].y);
    ctx.lineTo(f.pts[1].x,f.pts[1].y);
    ctx.lineTo(f.pts[2].x,f.pts[2].y);
    ctx.closePath();
    ctx.fillStyle=`rgba(126,32,39,${alpha})`;
    ctx.fill();
    ctx.strokeStyle=light>.5?"rgba(190,85,91,.78)":"rgba(107,42,47,.68)";
    ctx.lineWidth=Math.max(.6,dpr*.52);
    ctx.stroke();
  }
}
function renderAll(){
  const g=editorGeometry();
  renderModel(el.boltCanvas,{tris:g.bolt.tris},view.bolt);
  renderModel(el.nutCanvas,{tris:g.nut.tris},view.nut);
}

function bindMove(canvas,key){
  const v=view[key];
  canvas.addEventListener("pointerdown",e=>{
    v.drag=true;
    v.px=e.clientX;
    v.py=e.clientY;
    canvas.classList.add("dragging");
    canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove",e=>{
    if(!v.drag)return;
    const dx=e.clientX-v.px;
    const dy=e.clientY-v.py;
    v.yaw+=dx*0.012;
    v.pitch+=dy*0.010;
    if(v.pitch>Math.PI*2) v.pitch-=Math.PI*2;
    if(v.pitch<0) v.pitch+=Math.PI*2;
    v.px=e.clientX;
    v.py=e.clientY;
    renderAll();
  });
  const end=e=>{
    v.drag=false;
    canvas.classList.remove("dragging");
    try{canvas.releasePointerCapture(e.pointerId)}catch{}
  };
  canvas.addEventListener("pointerup",end);
  canvas.addEventListener("pointercancel",end);
  canvas.addEventListener("wheel",e=>{
    e.preventDefault();
    v.zoom=clamp(v.zoom*(e.deltaY>0?.92:1.08),.55,2.1);
    renderAll();
  },{passive:false});
}

function translateTris(tris,dx,dy,dz=0){
  return tris.map(t=>t.map(p=>({x:p.x+dx,y:p.y+dy,z:p.z+dz})));
}
function pack(objects){
  if(!objects.length)return [];
  const items=objects.slice().sort((a,b)=>b.r-a.r);
  const area=items.reduce((s,o)=>s+Math.PI*o.r*o.r,0);
  let best=null,bestScore=Infinity;
  for(let pass=0;pass<12;pass++){
    const target=Math.sqrt(area)*(1.08+pass*.07);
    let x=0,y=0,rowH=0,maxW=0;
    const placed=[];
    for(const o of items){
      const d=o.r*2,gap=Math.max(.8,o.r*.10);
      if(x>0 && x+d>target){y+=rowH; x=0; rowH=0}
      placed.push({...o,x:x+o.r,y:y+o.r});
      x+=d+gap;rowH=Math.max(rowH,d+gap);maxW=Math.max(maxW,x);
    }
    const H=y+rowH,W=maxW;
    const aspect=Math.max(W/H,H/W);
    const score=W*H*(1+(aspect-1)*1.35);
    if(score<bestScore){bestScore=score;best={placed,W,H}}
  }
  const cx=best.W/2,cy=best.H/2;
  return best.placed.map(o=>({kind:o.kind,tris:translateTris(o.tris,o.x-cx,o.y-cy,0)}));
}
function buildExport(){
  const d=currentData();
  if(!d)return false;
  const bq=qty(el.boltQty),nq=qty(el.nutQty),wq=qty(el.washerQty);
  if(bq+nq+wq===0)return false;

  const bolt=makeBolt(d,system,Number(el.shaft.value)||d.boltL,Number(el.head.value)||d.boltH);
  const nut=makeNut(d,system,Number(el.nutT.value)||d.nutH);
  const washer=makeWasher(d,system);

  const objs=[];
  const br=bolt.dims.AF/(2*Math.cos(Math.PI/6));
  const nr=nut.dims.AF/(2*Math.cos(Math.PI/6));
  const wr=washer.dims.OD/2;
  for(let i=0;i<bq;i++)objs.push({kind:"BOLT",tris:bolt.tris,r:br});
  for(let i=0;i<nq;i++)objs.push({kind:"NUT",tris:nut.tris,r:nr});
  for(let i=0;i<wq;i++)objs.push({kind:"WASHER",tris:washer.tris,r:wr});

  exportObjects=pack(objs);
  exportMesh=exportObjects.flatMap(o=>o.tris);
  exportMeta={system,size:activeKey,qty:{bolt:bq,nut:nq,washer:wq}};
  return true;
}
function projectPrintPoint(p){
  return projectPoint(p,DEFAULT_VIEW);
}

function renderPreview(){
  const canvas=el.preview,rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2);
  const w=Math.max(1,rect.width*dpr),h=Math.max(1,rect.height*dpr);
  if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h}
  const ctx=canvas.getContext("2d");ctx.clearRect(0,0,w,h);
  if(!exportMesh.length)return;
  const all=exportMesh.flat().map(projectPrintPoint);
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  for(const p of all){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);minY=Math.min(minY,p.y);maxY=Math.max(maxY,p.y)}
  const scale=Math.min(w/((maxX-minX)*1.18),h/((maxY-minY)*1.25));
  const cx=w*.5,cy=h*.56,ox=(minX+maxX)/2,oy=(minY+maxY)/2;
  const faces=[];
  for(const o of exportObjects){
    for(const t of o.tris){
      const r=t.map(projectPrintPoint);
      const pts=r.map(p=>({x:cx+(p.x-ox)*scale,y:cy-(p.y-oy)*scale,z:p.z}));
      const n=normal(r[0],r[1],r[2]);
      faces.push({pts,n,z:(r[0].z+r[1].z+r[2].z)/3});
    }
  }
  faces.sort((a,b)=>a.z-b.z);
  ctx.save();
  ctx.strokeStyle="rgba(165,177,185,.12)";
  ctx.lineWidth=1;
  const grid=28*dpr;
  for(let x=0;x<w;x+=grid){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
  for(let y=0;y<h;y+=grid){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
  ctx.restore();
  for(const f of faces){
    const light=Math.max(.08,.33+.67*Math.abs(f.n.z*.7+f.n.x*.2+f.n.y*.1));
    ctx.beginPath();ctx.moveTo(f.pts[0].x,f.pts[0].y);ctx.lineTo(f.pts[1].x,f.pts[1].y);ctx.lineTo(f.pts[2].x,f.pts[2].y);ctx.closePath();
    ctx.fillStyle=`rgba(126,32,39,${Math.min(.84,.34+light*.43)})`;ctx.fill();
    ctx.strokeStyle=light>.5?"rgba(195,92,98,.82)":"rgba(108,47,51,.72)";ctx.stroke();
  }
  ctx.save();ctx.scale(dpr,dpr);
  ctx.fillStyle="#d8dde0";ctx.font="800 10px system-ui,sans-serif";ctx.fillText("PRINT LAYOUT · Z UP",13,19);
  ctx.fillStyle="#8e989e";ctx.font="600 9px system-ui,sans-serif";ctx.fillText("Exact export geometry",13,34);
  ctx.restore();
}
function stlBlob(tris){
  const buffer=new ArrayBuffer(84+tris.length*50);
  const dv=new DataView(buffer);
  const head="FastenerPrep binary STL";
  for(let i=0;i<head.length&&i<80;i++)dv.setUint8(i,head.charCodeAt(i));
  dv.setUint32(80,tris.length,true);
  let o=84;
  for(const t of tris){
    const n=normal(t[0],t[1],t[2]);
    const len=Math.hypot(n.x,n.y,n.z)||1;
    const vals=[n.x/len,n.y/len,n.z/len,
      t[0].x,t[0].y,t[0].z,t[1].x,t[1].y,t[1].z,t[2].x,t[2].y,t[2].z];
    vals.forEach(v=>{dv.setFloat32(o,v,true);o+=4});
    dv.setUint16(o,0,true);o+=2;
  }
  return new Blob([buffer],{type:"model/stl"});
}
function filename(){
  const q=exportMeta.qty,mods=[];
  if(q.bolt)mods.push(`BOLTx${q.bolt}`);
  if(q.nut)mods.push(`NUTx${q.nut}`);
  if(q.washer)mods.push(`WASHERx${q.washer}`);
  let size=exportMeta.size.replace("#","NO").replaceAll("/","-");
  return `${exportMeta.system}-${size}-${mods.join("-")}.stl`;
}
function download(){
  const blob=stlBlob(exportMesh);
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=filename();
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  el.modal.classList.add("hidden");
}
function openSave(){
  if(!currentData()){show("Select a system and size first.");return}
  if(!buildExport()){show("Set at least one part quantity above 0.");return}
  const q=exportMeta.qty,parts=[];
  if(q.bolt)parts.push(`${q.bolt} bolt${q.bolt===1?"":"s"}`);
  if(q.nut)parts.push(`${q.nut} nut${q.nut===1?"":"s"}`);
  if(q.washer)parts.push(`${q.washer} washer${q.washer===1?"":"s"}`);
  el.modalSummary.textContent=parts.join(" · ");
  el.modal.classList.remove("hidden");
  requestAnimationFrame(renderPreview);
}
function resetBolt(){
  const d=currentData();if(!d)return;
  el.shaft.value=fmt(d.boltL);el.head.value=fmt(d.boltH);renderAll();
}
function resetNut(){
  const d=currentData();if(!d)return;
  el.nutT.value=fmt(d.nutH);renderAll();
}
function normalizeQty(input){input.value=String(qty(input))}

el.metric.addEventListener("click",()=>setSystem("METRIC"));
el.sae.addEventListener("click",()=>setSystem("SAE"));
el.size.addEventListener("change",()=>selectSize(el.size.value));

document.querySelectorAll("[data-step]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    const [kind,delta]=btn.dataset.step.split(":");
    const input=kind==="bolt"?el.boltQty:kind==="nut"?el.nutQty:el.washerQty;
    input.value=String(clamp(qty(input)+Number(delta),0,20));
  });
});
[el.boltQty,el.nutQty,el.washerQty].forEach(input=>{
  input.addEventListener("input",()=>normalizeQty(input));
  input.addEventListener("change",()=>normalizeQty(input));
});

[el.shaft,el.head,el.nutT].forEach(input=>input.addEventListener("input",renderAll));
el.boltReset.addEventListener("click",resetBolt);
el.nutReset.addEventListener("click",resetNut);
el.save.addEventListener("click",openSave);
el.back.addEventListener("click",()=>el.modal.classList.add("hidden"));
el.download.addEventListener("click",download);
window.addEventListener("resize",()=>{renderAll();if(!el.modal.classList.contains("hidden"))renderPreview()});

bindMove(el.boltCanvas,"bolt");
bindMove(el.nutCanvas,"nut");

syncLock();
syncInputs();
renderAll();
})();
</script>
